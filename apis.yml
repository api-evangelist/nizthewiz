name: Nizthewiz
description: >-
  NizTheWiz Technology Sdn Bhd is a Kuala Lumpur, Malaysia based logistics
  startup founded in 2015 that operates a crowd-sourced, on-demand same-day
  local courier and delivery platform. Its consumer mobile app connects
  senders with a crowd-sourced fleet of couriers and provides live GPS
  tracking and full last-mile transparency across the delivery lifecycle.
  The company was surfaced as a 500 Global portfolio company and added to the
  API Evangelist network. As of this enrichment pass NizTheWiz publishes no
  public developer program, API documentation, OpenAPI specification, or SDKs
  — its product is a consumer-facing courier app rather than a developer
  platform, so there is no API surface to catalog.
